<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#074a9e" />
    <meta
      name="description"
      content="AllCanAccess — Discussions, resources, tools, and events for web accessibility teams."
    />
    <title>AllCanAccess</title>
    
    <!-- Open Graph Tags for Social Sharing -->
    <meta property="og:title" content="AllCanAccess" />
    <meta property="og:description" content="Join AllCanAccess, the world's leading digital accessibility community. Connect with WCAG experts, developers, and designers." />
    <meta property="og:image" content="https://allcanaccess.com/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://allcanaccess.com/" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // FOIT prevention – set theme before first paint
      (function() {
        var stored = localStorage.getItem('aca-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
